name: RinVulkan CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RinOS-Project/RinGPU
          path: RinGPU
      - run: cmake -S . -B build -DRINGPU_DIR="$GITHUB_WORKSPACE/RinGPU" -DBUILD_TESTING=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
